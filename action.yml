name: 'NRF Connect SDK CI action'
description: 'Building nrf connect sdk projects'
branding:
  color: blue
  icon: link
inputs:
  board:  # id of input
    description: 'Board for build'
    required: true
  build_dir:
    description: 'Building directory'
    required: false
    default: 'build'
  add_flags:
    description: 'Additional flags'
    required: true
    default: '--no-sysbuild'
  mcuboot_conf_file:
    description: 'MCUboot configuration file'
  board_root:
    description: 'Root Directory where the boards can be found'
  workspace_dir:
    description: 'Name of the workspace directory where the project-builds will be placed'
    required: false
    default: 'workspace'
  project_root:
    description: 'Root Directory where the project files are located'
    required: false
    default: '/github/workspace'
  file_suffix:
    description: 'Configuration file suffix'
    required: false
    default: 'release'
runs:
  using: 'docker'
  image: 'docker://ghcr.io/metax-sensors/nrf-connect-sdk-ci:v3.4.0'
  args:
    - sh 
    - ./build.sh
    - .
    - --pristine
    - --board 
    - ${{ inputs.project_root }}
    - ${{ inputs.board }}
    - ${{ inputs.add_flags }}
    - -Dmcuboot_CONF_FILE=${{ inputs.mcuboot_conf_file }}
    - -DCONF_FILE=${{ inputs.conf_file }}
    - ${{ inputs.build_dir }}
    - ${{ inputs.file_suffix }}
    - ${{ inputs.workspace_dir }}
    - /workdir/ncs
